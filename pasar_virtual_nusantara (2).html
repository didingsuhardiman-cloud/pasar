<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasar Virtual Nusantara</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            800: '#9a3412',
                        },
                        market: {
                            emerald: '#059669',
                            teal: '#0d9488',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }
        .animate-bounce-slow {
            animation: bounce 2s infinite;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-orange-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Sample initial market items
        const INITIAL_PRODUCTS = [
            {
                id: 'prod-1',
                name: 'Kopi Arabika Gayo Single Origin 250g',
                category: 'Makanan & Minuman',
                price: 65000,
                stock: 12,
                condition: 'Baru',
                sellerName: 'Pak Teuku Kopi',

                sellerContact: '0812-9876-5432',
                stallNumber: 'Lapak A-01',
                image: 'https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=500&auto=format&fit=crop&q=80',
                description: 'Kopi Arabika Gayo roasted fresh medium-dark. Aroma wangi dengan note cokelat dan buah tropis.',
                isUserProduct: false,
                likes: 18,
                createdDate: '10 min lalu'
            },
            {
                id: 'prod-2',
                name: 'Batik Tulis Madura Motif Klasik Murni',
                category: 'Pakaian & Fashion',
                price: 275000,
                stock: 4,
                condition: 'Baru',
                sellerName: 'Ibu Hj. Siti',
                sellerShop: 'Batik Pesona Madura',
                sellerContact: '0857-1122-3344',
                stallNumber: 'Lapak B-03',
                image: 'https://images.unsplash.com/photo-1601924994987-69e26d50dc26?w=500&auto=format&fit=crop&q=80',
                description: 'Kain batik tulis sutra halus buatan tangan asli Bangkalan Madura. Ukuran 2.2m x 1.15m.',
                isUserProduct: false,
                likes: 32,
                createdDate: '25 min lalu'
            },
            {
                id: 'prod-3',
                name: 'Keripik Tempe Renyah Gurih (Packaging 500g)',
                category: 'Makanan & Minuman',
                price: 28000,
                stock: 30,
                condition: 'Baru',
                sellerName: 'Mas Danang',
                sellerShop: 'Oleh-Oleh Khas Ngawi',
                sellerContact: '0813-4455-6677',
                stallNumber: 'Lapak A-05',
                image: 'https://images.unsplash.com/photo-1599490659213-e2b9527bd087?w=500&auto=format&fit=crop&q=80',
                description: 'Keripik tempe renyah bumbu rempah warisan keluarga. Tanpa bahan pengawet, dijamin kriuk!',
                isUserProduct: false,
                likes: 24,
                createdDate: '1 jam lalu'
            },
            {
                id: 'prod-4',
                name: 'Smartphone Android Bekas Mulus 95% 128GB',
                category: 'Elektronik',
                price: 1350000,
                stock: 1,
                condition: 'Bekas Berkualitas',
                sellerName: 'Budi Cell',
                sellerShop: 'Lapak Gadget Murah',
                sellerContact: '0821-3344-5566',
                stallNumber: 'Lapak C-02',
                image: 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500&auto=format&fit=crop&q=80',
                description: 'HP pemakaian pribadi, layar mulus, baterai awet, lengkap box dan charger original.',
                isUserProduct: false,
                likes: 15,
                createdDate: '2 jam lalu'
            },
            {
                id: 'prod-5',
                name: 'Tas Anyaman Pandan Handmade Premium',
                category: 'Kerajinan Tangan',
                price: 95000,
                stock: 8,
                condition: 'Baru',
                sellerName: 'Mbak Rina',
                sellerShop: 'Anyaman Craft Tasik',
                sellerContact: '0878-9000-1122',
                stallNumber: 'Lapak B-07',
                image: 'https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=500&auto=format&fit=crop&q=80',
                description: 'Tas kerajinan anyaman serat alam ramah lingkungan, elegan untuk bepergian dan santai.',
                isUserProduct: false,
                likes: 41,
                createdDate: '3 jam lalu'
            },
            {
                id: 'prod-6',
                name: 'Beras Pandan Wangi Organik Super 5kg',
                category: 'Sembako & Tani',
                price: 82000,
                stock: 20,
                condition: 'Baru',
                sellerName: 'Toko Tani Makmur',
                sellerShop: 'Toko Sembako Berkah',
                sellerContact: '0812-7788-9900',
                stallNumber: 'Lapak A-02',
                image: 'https://images.unsplash.com/photo-1586201375761-83865001e31c?w=500&auto=format&fit=crop&q=80',
                description: 'Beras pandan wangi mentik wangi asli Cianjur, pulen, wangi alami tanpa pewangi buatan.',
                isUserProduct: false,
                likes: 19,
                createdDate: '4 jam lalu'
            }
        ];

        const CATEGORIES = [
            'Semua',
            'Sembako & Tani',
            'Makanan & Minuman',
            'Pakaian & Fashion',
            'Elektronik',
            'Kerajinan Tangan',
            'Perabotan Rumah'
        ];

        // Utility helper to format IDR currency
        const formatIDR = (val) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                maximumFractionDigits: 0
            }).format(val);
        };

        // Utility helper to generate direct WhatsApp chat link
        const formatWaUrl = (phone, productName, price) => {
            if (!phone) return '#';
            let cleanPhone = phone.replace(/[^0-9]/g, '');
            if (cleanPhone.startsWith('0')) {
                cleanPhone = '62' + cleanPhone.slice(1);
            }
            const msg = `Halo, saya berminat membeli barang "${productName}" seharga ${formatIDR(price)} di Pasar Virtual Nusantara. Apakah masih ada stok?`;
            return `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`;
        };

        // Main Application Component
        function App() {
            // States
            const [products, setProducts] = useState(() => {
                const saved = localStorage.getItem('pasar_virtual_products');
                return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
            });

            const [activeTab, setActiveTab] = useState('explore'); // explore, stalls, my-shop
            const [selectedCategory, setSelectedCategory] = useState('Semua');
            const [searchQuery, setSearchQuery] = useState('');
            const [priceFilter, setPriceFilter] = useState('all'); // all, under50k, 50k-200k, over200k

            // Modal States
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [selectedProduct, setSelectedProduct] = useState(null); // Detail modal

            // User Info (Default Seller Profile)
            const [userProfile, setUserProfile] = useState(() => {
                const saved = localStorage.getItem('pasar_virtual_user');
                return saved ? JSON.parse(saved) : {
                    name: 'Sobat Pasar',
                    shopName: 'Lapak Berkembang',
                    contact: '0812-3456-7890',
                    stallNumber: 'Lapak D-08',
                    avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=PasarUser'
                };
            });

            // Activity Feed Ticker Messages
            const [activities, setActivities] = useState([
                'Pak Teuku baru saja menjual 1 Kopi Gayo',
                'Mbak Rina menambahkan barang baru "Tas Anyaman"',
                'Pengunjung baru memasuki Lapak B-03',
                'Pembeli memesan Batik Tulis Madura via WhatsApp'
            ]);

            // Save products to local storage
            useEffect(() => {
                localStorage.setItem('pasar_virtual_products', JSON.stringify(products));
            }, [products]);

            // Save user profile to local storage
            useEffect(() => {
                localStorage.setItem('pasar_virtual_user', JSON.stringify(userProfile));
            }, [userProfile]);

            // Simulation of live market activity feed ticker
            useEffect(() => {
                const interval = setInterval(() => {
                    const sampleActivities = [
                        'Seseorang sedang bertanya stok Kopi Gayo via WA...',
                        'Stok Beras Pandan Wangi tersisa 19 karung!',
                        'Pengunjung baru menjelajahi Lapak Gadget Murah',
                        'Transaksi berhasil dilakukan di Lapak A-05',
                        'Mas Danang memberikan promo spesial harbolnas!'
                    ];
                    const randomAct = sampleActivities[Math.floor(Math.random() * sampleActivities.length)];
                    setActivities(prev => [randomAct, ...prev.slice(0, 4)]);
                }, 8000);
                return () => clearInterval(interval);
            }, []);

            // Filter products logic
            const filteredProducts = useMemo(() => {
                return products.filter(item => {
                    const matchesCategory = selectedCategory === 'Semua' || item.category === selectedCategory;
                    const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                          item.sellerShop.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                          item.description.toLowerCase().includes(searchQuery.toLowerCase());
                    
                    let matchesPrice = true;
                    if (priceFilter === 'under50k') matchesPrice = item.price < 50000;
                    else if (priceFilter === '50k-200k') matchesPrice = item.price >= 50000 && item.price <= 200000;
                    else if (priceFilter === 'over200k') matchesPrice = item.price > 200000;

                    return matchesCategory && matchesSearch && matchesPrice;
                });
            }, [products, selectedCategory, searchQuery, priceFilter]);

            // Add Product Handler
            const handleAddProduct = (newProductData) => {
                const newProd = {
                    id: 'prod-' + Date.now(),
                    ...newProductData,
                    sellerName: userProfile.name,
                    sellerShop: userProfile.shopName,
                    sellerContact: newProductData.sellerContact || userProfile.contact,
                    stallNumber: userProfile.stallNumber,
                    isUserProduct: true,
                    likes: 0,
                    createdDate: 'Baru saja'
                };
                
                // Automatically update user profile contact if provided
                if (newProductData.sellerContact) {
                    setUserProfile(prev => ({ ...prev, contact: newProductData.sellerContact }));
                }

                setProducts([newProd, ...products]);
                setIsAddModalOpen(false);
                
                // Add notification activity
                setActivities(prev => [`${userProfile.shopName} menawarkan barang baru: "${newProd.name}"`, ...prev]);
            };

            // Delete User Product
            const handleDeleteProduct = (id) => {
                setProducts(products.filter(p => p.id !== id));
                if (selectedProduct && selectedProduct.id === id) {
                    setSelectedProduct(null);
                }
            };

            // Like Product Handler
            const handleLikeProduct = (id, e) => {
                if (e) e.stopPropagation();
                setProducts(products.map(p => {
                    if (p.id === id) {
                        return { ...p, likes: p.likes + 1 };
                    }
                    return p;
                }));
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    {/* Top Announcement Live Ticker */}
                    <div className="bg-gradient-to-r from-amber-600 via-orange-600 to-amber-700 text-white py-2 px-4 text-xs md:text-sm font-medium flex items-center justify-between shadow-inner">
                        <div className="flex items-center space-x-2 overflow-hidden w-full max-w-5xl mx-auto">
                            <span className="bg-red-500 text-white font-bold text-[10px] uppercase px-2 py-0.5 rounded-full animate-pulse flex-shrink-0">
                                <i className="fa-solid fa-tower-broadcast mr-1"></i> Live Pasar
                            </span>
                            <div className="truncate text-amber-100">
                                {activities[0] || 'Pasar Virtual Nusantara ramai pengunjung!'}
                            </div>
                        </div>
                    </div>

                    {/* Main Header / Navbar */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm glass-effect">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                {/* Brand Logo */}
                                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('explore')}>
                                    <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-500 to-amber-500 flex items-center justify-center text-white shadow-md shadow-orange-500/20">
                                        <i className="fa-solid fa-store text-xl"></i>
                                    </div>
                                    <div>
                                        <h1 className="text-lg font-extrabold text-slate-800 leading-none">
                                            Pasar<span className="text-orange-600">Virtual</span>
                                        </h1>
                                        <p className="text-[11px] text-slate-500 font-medium">Buka Lapak & Jual Beli Langsung</p>
                                    </div>
                                </div>

                                {/* Desktop Navigation Links */}
                                <nav className="hidden md:flex items-center space-x-1">
                                    <button
                                        onClick={() => setActiveTab('explore')}
                                        className={`px-4 py-2 rounded-xl text-sm font-semibold transition-all flex items-center space-x-2 ${
                                            activeTab === 'explore'
                                                ? 'bg-orange-50 text-orange-600'
                                                : 'text-slate-600 hover:bg-slate-100'
                                        }`}
                                    >
                                        <i className="fa-solid fa-basket-shopping"></i>
                                        <span>Jelajah Pasar</span>
                                    </button>

                                    <button
                                        onClick={() => setActiveTab('stalls')}
                                        className={`px-4 py-2 rounded-xl text-sm font-semibold transition-all flex items-center space-x-2 ${
                                            activeTab === 'stalls'
                                                ? 'bg-orange-50 text-orange-600'
                                                : 'text-slate-600 hover:bg-slate-100'
                                        }`}
                                    >
                                        <i className="fa-solid fa-map-location-dot"></i>
                                        <span>Denah Lapak</span>
                                    </button>

                                    <button
                                        onClick={() => setActiveTab('my-shop')}
                                        className={`px-4 py-2 rounded-xl text-sm font-semibold transition-all flex items-center space-x-2 ${
                                            activeTab === 'my-shop'
                                                ? 'bg-orange-50 text-orange-600'
                                                : 'text-slate-600 hover:bg-slate-100'
                                        }`}
                                    >
                                        <i className="fa-solid fa-shop"></i>
                                        <span>Lapak Saya</span>
                                        {products.filter(p => p.isUserProduct).length > 0 && (
                                            <span className="bg-orange-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">
                                                {products.filter(p => p.isUserProduct).length}
                                            </span>
                                        )}
                                    </button>
                                </nav>

                                {/* Action Buttons */}
                                <div className="flex items-center space-x-2">
                                    <button
                                        onClick={() => setIsAddModalOpen(true)}
                                        className="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold px-4 py-2.5 rounded-xl text-sm shadow-md shadow-orange-500/20 transition-all flex items-center space-x-2 active:scale-95"
                                    >
                                        <i className="fa-solid fa-plus"></i>
                                        <span className="hidden sm:inline">Tawarkan Barang</span>
                                    </button>

                                    {/* User Mini Profile Badge */}
                                    <div className="flex items-center pl-2 border-l border-slate-200">
                                        <img
                                            src={userProfile.avatar}
                                            alt="Avatar"
                                            className="w-9 h-9 rounded-full bg-slate-100 border border-slate-300 object-cover"
                                        />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
                        {activeTab === 'explore' && (
                            <ExploreView
                                products={filteredProducts}
                                categories={CATEGORIES}
                                selectedCategory={selectedCategory}
                                setSelectedCategory={setSelectedCategory}
                                searchQuery={searchQuery}
                                setSearchQuery={setSearchQuery}
                                priceFilter={priceFilter}
                                setPriceFilter={setPriceFilter}
                                onSelectProduct={(prod) => setSelectedProduct(prod)}
                                onLike={handleLikeProduct}
                                onOpenAddModal={() => setIsAddModalOpen(true)}
                            />
                        )}

                        {activeTab === 'stalls' && (
                            <StallsMapView
                                products={products}
                                onSelectProduct={(prod) => setSelectedProduct(prod)}
                                userStall={userProfile.stallNumber}
                                onOpenAddModal={() => setIsAddModalOpen(true)}
                            />
                        )}

                        {activeTab === 'my-shop' && (
                            <MyShopView
                                products={products.filter(p => p.isUserProduct)}
                                userProfile={userProfile}
                                setUserProfile={setUserProfile}
                                onDeleteProduct={handleDeleteProduct}
                                onOpenAddModal={() => setIsAddModalOpen(true)}
                                onSelectProduct={(prod) => setSelectedProduct(prod)}
                            />
                        )}
                    </main>

                    {/* Bottom Mobile Navigation */}
                    <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-30 px-3 py-2 flex justify-around items-center glass-effect">
                        <button
                            onClick={() => setActiveTab('explore')}
                            className={`flex flex-col items-center space-y-1 text-xs font-semibold ${
                                activeTab === 'explore' ? 'text-orange-600' : 'text-slate-500'
                            }`}
                        >
                            <i className="fa-solid fa-basket-shopping text-lg"></i>
                            <span>Pasar</span>
                        </button>

                        <button
                            onClick={() => setActiveTab('stalls')}
                            className={`flex flex-col items-center space-y-1 text-xs font-semibold ${
                                activeTab === 'stalls' ? 'text-orange-600' : 'text-slate-500'
                            }`}
                        >
                            <i className="fa-solid fa-map-location-dot text-lg"></i>
                            <span>Denah</span>
                        </button>

                        <button
                            onClick={() => setIsAddModalOpen(true)}
                            className="w-12 h-12 -mt-5 bg-gradient-to-tr from-orange-500 to-amber-500 text-white rounded-full flex items-center justify-center shadow-lg shadow-orange-500/30 font-bold"
                        >
                            <i className="fa-solid fa-plus text-xl"></i>
                        </button>

                        <button
                            onClick={() => setActiveTab('my-shop')}
                            className={`flex flex-col items-center space-y-1 text-xs font-semibold ${
                                activeTab === 'my-shop' ? 'text-orange-600' : 'text-slate-500'
                            }`}
                        >
                            <i className="fa-solid fa-shop text-lg"></i>
                            <span>Lapak Ku</span>
                        </button>
                    </div>

                    {/* Modals */}
                    {isAddModalOpen && (
                        <AddProductModal
                            onClose={() => setIsAddModalOpen(false)}
                            onSubmit={handleAddProduct}
                            userProfile={userProfile}
                        />
                    )}

                    {selectedProduct && (
                        <ProductDetailModal
                            product={selectedProduct}
                            onClose={() => setSelectedProduct(null)}
                            onLike={handleLikeProduct}
                        />
                    )}

                    {/* Footer */}
                    <footer className="bg-white border-t border-slate-200 mt-12 py-6 text-center text-xs text-slate-500 mb-14 md:mb-0">
                        <p className="font-semibold text-slate-700 mb-1">Pasar Virtual Nusantara &copy; 2026</p>
                        <p>Tempat Berkumpul Pedagang & Pembeli dari Seluruh Pelosok Negeri</p>
                    </footer>
                </div>
            );
        }

        function ExploreView({
            products,
            categories,
            selectedCategory,
            setSelectedCategory,
            searchQuery,
            setSearchQuery,
            priceFilter,
            setPriceFilter,
            onSelectProduct,
            onLike,
            onOpenAddModal
        }) {
            return (
                <div className="space-y-6">
                    {/* Hero Banner */}
                    <div className="relative rounded-3xl overflow-hidden bg-gradient-to-r from-orange-600 via-amber-600 to-amber-700 text-white p-6 md:p-10 shadow-lg">
                        <div className="absolute -right-10 -bottom-10 opacity-20 pointer-events-none">
                            <i className="fa-solid fa-shop text-[220px]"></i>
                        </div>
                        <div className="relative z-10 max-w-2xl space-y-3">
                            <span className="inline-block bg-white/20 backdrop-blur-md text-white font-semibold text-xs px-3 py-1 rounded-full border border-white/30">
                                🛒 Platform Jual Beli Online Praktis & Langsung
                            </span>
                            <h2 className="text-2xl md:text-4xl font-black leading-tight">
                                Mari Jual & Beli Barang di Pasar Virtual Nusantara!
                            </h2>
                            <p className="text-amber-100 text-sm md:text-base">
                                Punya produk lokal, sembako, kerajinan, atau barang bekas berkualitas? Buka lapak gratis dan tawarkan barangmu sekarang!
                            </p>
                            <div className="pt-2 flex flex-wrap gap-3">
                                <button
                                    onClick={onOpenAddModal}
                                    className="bg-white text-orange-600 font-extrabold px-5 py-2.5 rounded-xl shadow-md hover:bg-orange-50 transition-all text-sm flex items-center space-x-2"
                                >
                                    <i className="fa-solid fa-plus-circle"></i>
                                    <span>Tawarkan Barang Jualan</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Search and Filters Bar */}
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                        <div className="flex flex-col md:flex-row gap-3">
                            {/* Search Input */}
                            <div className="relative flex-1">
                                <i className="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input
                                    type="text"
                                    placeholder="Cari nama barang, nama lapak, atau deskripsi..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition-all"
                                />
                                {searchQuery && (
                                    <button
                                        onClick={() => setSearchQuery('')}
                                        className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
                                    >
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                )}
                            </div>

                            {/* Price Filter Dropdown */}
                            <div className="w-full md:w-56">
                                <select
                                    value={priceFilter}
                                    onChange={(e) => setPriceFilter(e.target.value)}
                                    className="w-full py-2.5 px-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium text-slate-700"
                                >
                                    <option value="all">Semua Range Harga</option>

                                src={product.image}
                                alt={product.name}
                                className="w-full h-full object-cover"
                            />
                            <button
                                onClick={onClose}
                                className="absolute top-4 right-4 w-9 h-9 rounded-full bg-slate-900/70 text-white flex items-center justify-center shadow hover:bg-slate-900 transition-all"
                            >
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                            <div className="absolute bottom-4 left-4 bg-slate-900/80 backdrop-blur-md text-white text-xs font-bold px-3 py-1.5 rounded-xl">
                                {product.category}
                            </div>
                        </div>

                        <div className="p-6 space-y-5">
                            {/* Seller Badge */}
                            <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                                <div className="flex items-center space-x-3">
                                    <div className="w-10 h-10 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center font-bold">
                                        <i className="fa-solid fa-shop"></i>
                                    </div>
                                    <div>
                                        <h4 className="font-extrabold text-slate-800 text-sm">{product.sellerShop}</h4>
                                        <p className="text-xs text-slate-500">Penjual: {product.sellerName} • <span className="font-semibold text-orange-600">{product.stallNumber}</span></p>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <span className="text-[10px] bg-slate-100 px-2 py-1 rounded-md text-slate-600 font-semibold block">
                                        Kondisi: {product.condition}
                                    </span>
                                    <span className="text-[10px] text-slate-400 mt-1 block">Stok: {product.stock} unit</span>
                                </div>
                            </div>

                            {/* Title & Description */}
                            <div>
                                <h2 className="text-xl font-extrabold text-slate-800">{product.name}</h2>
                                <p className="text-slate-600 text-sm mt-2 leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100">
                                    {product.description || 'Tidak ada deskripsi tambahan.'}
                                </p>
                            </div>

                            {/* Price & Primary Actions */}
                            <div className="bg-orange-50 border border-orange-100 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                <div>
                                    <span className="text-xs text-slate-500 font-semibold block">Harga Produk</span>
                                    <span className="text-2xl font-black text-orange-600">{formatIDR(product.price)}</span>
                                </div>

                                <div className="flex items-center gap-2">
                                    <button
                                        onClick={(e) => onLike(product.id, e)}
                                        className="p-3 bg-white border border-slate-200 text-slate-600 rounded-xl hover:text-red-500 flex items-center space-x-1 font-bold text-xs shadow-sm"
                                        title="Sukai Barang"
                                    >
                                        <i className="fa-solid fa-heart text-red-500"></i>
                                        <span>{product.likes}</span>
                                    </button>

                                    <a
                                        href={formatWaUrl(product.sellerContact, product.name, product.price)}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold px-5 py-3 rounded-xl text-xs shadow-md transition-all flex items-center justify-center space-x-2 active:scale-95"
                                    >
                                        <i className="fa-brands fa-whatsapp text-lg"></i>
                                        <span>Pesan Langsung via WA</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function MyShopView({ products, userProfile, setUserProfile, onDeleteProduct, onOpenAddModal, onSelectProduct }) {
            const [isEditingProfile, setIsEditingProfile] = useState(false);
            const [profileForm, setProfileForm] = useState(userProfile);

            const handleSaveProfile = (e) => {
                e.preventDefault();
                setUserProfile(profileForm);
                setIsEditingProfile(false);
            };

            const totalValue = products.reduce((sum, item) => sum + (item.price * item.stock), 0);

            return (
                <div className="space-y-6">
                    {/* My Stall Profile Header */}
                    <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-6">
                        <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                            <div className="flex items-center space-x-4">
                                <img
                                    src={userProfile.avatar}
                                    alt="Lapak Avatar"
                                    className="w-16 h-16 rounded-2xl bg-orange-100 border-2 border-orange-400 p-1 object-cover"
                                />
                                <div>
                                    <div className="flex items-center space-x-2">
                                        <h2 className="text-xl font-extrabold text-slate-800">{userProfile.shopName}</h2>
                                        <span className="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-0.5 rounded-full">
                                            Lapak Aktif
                                        </span>
                                    </div>
                                    <p className="text-xs text-slate-500 mt-0.5">
                                        Pemilik: <span className="font-semibold text-slate-700">{userProfile.name}</span> • Nomor Stand: <span className="font-bold text-orange-600">{userProfile.stallNumber}</span>
                                    </p>
                                    <p className="text-xs text-slate-400 mt-0.5">Kontak WA: {userProfile.contact}</p>
                                </div>
                            </div>

                            <button
                                onClick={() => setIsEditingProfile(!isEditingProfile)}
                                className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-2 rounded-xl text-xs transition-all flex items-center space-x-1.5"
                            >
                                <i className="fa-solid fa-pen-to-square"></i>
                                <span>{isEditingProfile ? 'Batal' : 'Edit Profil Lapak'}</span>
                            </button>
                        </div>

                        {/* Edit Profile Form */}
                        {isEditingProfile && (
                            <form onSubmit={handleSaveProfile} className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3 animate-fade-in">
                                <h4 className="text-xs font-bold uppercase text-slate-600">Edit Informasi Lapak Anda</h4>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <input
                                        type="text"
                                        placeholder="Nama Penjual"
                                        value={profileForm.name}
                                        onChange={(e) => setProfileForm({ ...profileForm, name: e.target.value })}
                                        className="px-3 py-2 text-xs bg-white border border-slate-200 rounded-xl"
                                    />
                                    <input
                                        type="text"
                                        placeholder="Nama Lapak/Toko"
                                        value={profileForm.shopName}
                                        onChange={(e) => setProfileForm({ ...profileForm, shopName: e.target.value })}
                                        className="px-3 py-2 text-xs bg-white border border-slate-200 rounded-xl"
                                    />
                                    <input
                                        type="text"
                                        placeholder="No HP / WhatsApp"
                                        value={profileForm.contact}
                                        onChange={(e) => setProfileForm({ ...profileForm, contact: e.target.value })}
                                        className="px-3 py-2 text-xs bg-white border border-slate-200 rounded-xl"
                                    />
                                </div>
                                <button
                                    type="submit"
                                    className="bg-orange-500 text-white font-bold px-4 py-2 rounded-xl text-xs"
                                >
                                    Simpan Perubahan
                                </button>
                            </form>
                        )}

                        {/* Stall Quick Stats */}
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-3 pt-2">
                            <div className="bg-orange-50 p-3.5 rounded-2xl border border-orange-100">
                                <span className="text-[11px] text-slate-500 font-semibold block">Total Barang Dijual</span>
                                <span className="text-xl font-black text-orange-600">{products.length} Barang</span>
                            </div>
                            <div className="bg-emerald-50 p-3.5 rounded-2xl border border-emerald-100">
                                <span className="text-[11px] text-slate-500 font-semibold block">Estimasi Nilai Inventaris</span>
                                <span className="text-xl font-black text-emerald-600">{formatIDR(totalValue)}</span>
                            </div>
                            <div className="col-span-2 md:col-span-1 bg-amber-50 p-3.5 rounded-2xl border border-amber-100 flex items-center justify-between">
                                <div>
                                    <span className="text-[11px] text-slate-500 font-semibold block">Status Lapak</span>
                                    <span className="text-sm font-bold text-amber-700">Terbuka di Pasar</span>
                                </div>
                                <i className="fa-solid fa-door-open text-2xl text-amber-500"></i>
                            </div>
                        </div>
                    </div>

                    {/* My Listed Items Table/Grid */}
                    <div className="space-y-4">
                        <div className="flex items-center justify-between">
                            <h3 className="font-extrabold text-slate-800 text-base">Barang Jualan Saya</h3>
                            <button
                                onClick={onOpenAddModal}
                                className="bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold px-4 py-2 rounded-xl shadow transition-all flex items-center space-x-1"
                            >
                                <i className="fa-solid fa-plus"></i>
                                <span>Tambah Barang Baru</span>
                            </button>
                        </div>

                        {products.length > 0 ? (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                {products.map((item) => (
                                    <div key={item.id} className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3 flex flex-col justify-between">
                                        <div className="flex space-x-3 cursor-pointer" onClick={() => onSelectProduct(item)}>
                                            <img src={item.image} alt={item.name} className="w-16 h-16 object-cover rounded-xl bg-slate-100" />
                                            <div className="flex-1 overflow-hidden">
                                                <h4 className="font-bold text-xs text-slate-800 truncate">{item.name}</h4>
                                                <p className="text-xs font-black text-orange-600 mt-0.5">{formatIDR(item.price)}</p>
                                                <span className="text-[10px] bg-slate-100 px-2 py-0.5 rounded text-slate-600 inline-block mt-1">
                                                    Stok: {item.stock}
                                                </span>
                                            </div>
                                        </div>

                                        <div className="pt-2 border-t border-slate-100 flex items-center justify-between">
                                            <span className="text-[10px] text-slate-400">Diposting: {item.createdDate}</span>
                                            <button
                                                onClick={() => onDeleteProduct(item.id)}
                                                className="text-red-500 hover:text-red-700 font-bold text-xs px-2 py-1 rounded hover:bg-red-50 transition-all"
                                            >
                                                <i className="fa-solid fa-trash-can mr-1"></i> Hapus
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="bg-white rounded-2xl p-10 text-center border border-slate-200 space-y-3">
                                <div className="w-12 h-12 bg-orange-100 text-orange-500 rounded-full flex items-center justify-center mx-auto text-xl">
                                    <i className="fa-solid fa-store-slash"></i>
                                </div>
                                <h4 className="text-sm font-bold text-slate-800">Lapak Anda Masih Kosong</h4>
                                <p className="text-xs text-slate-500 max-w-xs mx-auto">
                                    Anda belum menawarkan barang apapun di pasar. Mulai tawarkan produk jualan Anda sekarang!
                                </p>
                                <button
                                    onClick={onOpenAddModal}
                                    className="bg-orange-500 text-white font-bold px-4 py-2 rounded-xl text-xs shadow hover:bg-orange-600 transition-all"
                                >
                                    <i className="fa-solid fa-plus mr-1"></i> Tawarkan Barang Pertama
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        window.onload = function() {
            const rootElement = document.getElementById('root');
            const root = ReactDOM.createRoot(rootElement);
            root.render(<App />);
        };
    </script>
</body>
</html>
